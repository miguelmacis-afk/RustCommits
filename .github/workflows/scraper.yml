name: Facepunch Commits Scraper

on:
  schedule:
    - cron: '*/10 * * * *' # Se ejecuta cada 10 minutos automáticamente
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la web con un botón

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para que el bot pueda guardar el JSON

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install requests beautifulsoup4 deep-translator openai

      - name: Ejecutar el Scraper
        env:
          # Carga las variables desde los secretos de GitHub para que no sean públicos
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scraper.py

      - name: Guardar el progreso (seen_commits.json)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add seen_commits.json
          # Comprueba si hay cambios en el JSON. Si los hay, hace un commit para guardarlos.
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Actualiza commits vistos" && git push)
