name: Facepunch Commits Scraper

on:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta cada 5 minutos automáticamente
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la web con un botón

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para que el bot pueda guardar el JSON

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        # Hemos limpiado las librerías que ya no usas
        run: pip install requests beautifulsoup4

      - name: Ejecutar el Scraper
        env:
          # Carga las variables desde los secretos de GitHub
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scraper.py
      
      - name: Guardar el progreso (seen_commits.json)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add seen_commits.json
          # Comprueba si hay cambios. Si los hay: commitea, sincroniza con el remoto y sube
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Actualiza commits vistos" && git pull --rebase origin main && git push)
